<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Impossible Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #060606;
            color: #ddd;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #1d1d1d;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .number {
            color: #555;
            font-family: monospace;
        }

        main {
            min-height: calc(100vh - 120px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .page {
            width: min(760px, 100%);
        }

        .door {
            border: 1px solid #222;
            background: #0b0b0b;

            padding: 50px;
        }

        .message {
            font-family: Georgia, serif;
            font-size: 18px;
            line-height: 2.1;
        }

        .message p {
            margin: 0 0 25px;
        }

        .numbers {
            margin-top: 40px;

            display: flex;
            justify-content: center;
            gap: 25px;

            color: #555;

            font-family: monospace;
            font-size: 13px;
        }

        .numbers span:nth-child(2) {
            color: #ddd;
        }

        .hint {
            margin-top: 35px;

            text-align: center;

            color: #333;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
        }

        footer {
            height: 50px;
            border-top: 1px solid #1d1d1d;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #333;
            font-family: monospace;
            font-size: 10px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">THE IMPOSSIBLE WEBSITE</div>
    <div class="number">010</div>
</header>

<main>

    <section class="page">

        <div class="door">

            <div class="message">

                <p>
                    Daniel placed his hand on the door.
                </p>

                <p>
                    There was no handle.
                </p>

                <p>
                    No lock.
                </p>

                <p>
                    No keyhole.
                </p>

                <p>
                    Yet the door opened.
                </p>

            </div>

            <div class="numbers">
                <span>20</span>
                <span>8</span>
                <span>5</span>
                <span>18</span>
                <span>5</span>
            </div>

            <div class="hint">
                THE NUMBERS ARE NOT RANDOM.
            </div>

        </div>

    </section>

</main>

<footer>
    SOME DOORS OPEN WITHOUT KEYS
</footer>

</body>
</html>
