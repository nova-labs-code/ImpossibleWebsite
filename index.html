<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #070707;
            color: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1d1d1d;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .number {
            color: #555;
            font-family: monospace;
        }

        main {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .puzzle {
            width: min(700px, 100%);
            text-align: center;
        }

        .object {
            width: 300px;
            height: 380px;
            margin: 0 auto 40px;

            border: 1px solid #444;
            background: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .glass {
            width: 220px;
            height: 300px;

            border: 1px solid #777;
            background: #161616;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .face {
            width: 70px;
            height: 90px;
            border: 1px solid #555;
            border-radius: 50%;
            opacity: .45;
        }

        .question {
            color: #555;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .hint {
            color: #333;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
        }

        footer {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #1d1d1d;
            color: #333;
            font-family: monospace;
            font-size: 10px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">THE IMPOSSIBLE WEBSITE</div>
    <div class="number">001</div>
</header>

<main>
    <section class="puzzle">

        <div class="object">
            <div class="glass">
                <div class="face"></div>
            </div>
        </div>

        <div class="question">
            I SHOW YOU EVERYTHING,<br>
            BUT KEEP NOTHING.
            <br><br>
            I COPY YOU PERFECTLY,<br>
            BUT NEVER MOVE FIRST.
            <br><br>
            BREAK ME,<br>
            AND I BECOME MANY.
        </div>

        <br>

        <div class="hint">
            WHAT AM I?
        </div>

    </section>
</main>

<footer>
    THERE IS NO LINK TO THE NEXT PAGE
</footer>
<script src="/ImpossibleWebsite/input.js"></script>
</body>
</html>
