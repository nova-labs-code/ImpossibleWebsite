<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Impossible Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: #ddd;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            padding: 0 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #1d1d1d;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .number {
            color: #555;
            font-family: monospace;
        }

        main {
            min-height: calc(100vh - 120px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .room {
            width: min(700px, 100%);
            height: 430px;

            border: 1px solid #222;
            background: #0b0b0b;

            position: relative;
        }

        .door {
            position: absolute;

            width: 170px;
            height: 300px;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            border: 1px solid #555;
            background: #101010;
        }

        .handle {
            position: absolute;

            width: 7px;
            height: 7px;

            right: 18px;
            top: 50%;

            border: 1px solid #777;
            border-radius: 50%;
        }

        .red {
            position: absolute;

            left: 50%;
            top: 45px;

            transform: translateX(-50%);

            color: #773030;

            font-family: monospace;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .hint {
            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: #333;
            font-family: monospace;
            font-size: 10px;
            white-space: nowrap;
        }

        footer {
            height: 50px;
            border-top: 1px solid #1d1d1d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-family: monospace;
            font-size: 10px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">THE IMPOSSIBLE WEBSITE</div>
    <div class="number">009</div>
</header>

<main>

    <div class="room">

        <div class="red">
            THERE IS NO WALL BEHIND ME.
        </div>

        <div class="door">
            <div class="handle"></div>
        </div>

        <div class="hint">
            WHAT SEPARATES TWO ROOMS?
        </div>

    </div>

</main>

<footer>
    009
</footer>
<script src="/ImpossibleWebsite/input.js"></script>
</body>
</html>
