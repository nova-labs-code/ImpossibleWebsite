<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Impossible Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: #ddd;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1d1d1d;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .number {
            color: #555;
            font-family: monospace;
        }

        main {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .message {
            width: min(700px, 100%);
            text-align: center;
        }

        .word {
            font-family: monospace;
            font-size: 26px;
            line-height: 2.4;
            color: #777;
        }

        .repeat {
            color: #aaa;
        }

        .gap {
            height: 35px;
        }

        .hint {
            margin-top: 40px;
            color: #333;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 2px;
        }

        footer {
            height: 50px;
            border-top: 1px solid #1d1d1d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-family: monospace;
            font-size: 10px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">THE IMPOSSIBLE WEBSITE</div>
    <div class="number">007</div>
</header>

<main>

    <section class="message">

        <div class="word">
            HELLO
        </div>

        <div class="word repeat">
            HELLO
        </div>

        <div class="word">
            HELLO
        </div>

        <div class="gap"></div>

        <div class="word repeat">
            HELLO
        </div>

        <div class="word">
            HELLO
        </div>

        <div class="word repeat">
            HELLO
        </div>

        <div class="hint">
            IT ANSWERS WITHOUT BEING ASKED.
        </div>

    </section>

</main>

<footer>
    007
</footer>

</body>
</html>
